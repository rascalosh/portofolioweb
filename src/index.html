<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Willbert Budi Lian - Full-Stack Developer & AI Engineer</title>
  <meta name="description" content="Portfolio of Willbert Budi Lian, a full-stack developer and AI engineer">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <!-- Apply the saved or system theme before first paint so dark-mode visitors never see a light flash. -->
  <script>
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) { }
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
