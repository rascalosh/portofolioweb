<section id="skills" class="px-6 py-16 md:py-24" aria-labelledby="skills-heading">
    <div class="mx-auto max-w-6xl">
        <h2 id="skills-heading" class="text-heading">Skills</h2>
        <p class="mt-3 max-w-xl text-muted-foreground">Linked skills point to the project or role where I used them.</p>

        <div class="mt-12 grid gap-4 md:grid-cols-2 lg:grid-cols-6">
            @for (group of groups; track group.id) {
            <div [class]="group.span">
                <section hlmCard class="h-full" [attr.aria-labelledby]="'skills-' + group.id">
                    <div hlmCardHeader>
                        <h3 hlmCardTitle [id]="'skills-' + group.id" class="text-lg font-semibold tracking-tight">{{ group.label }}</h3>
                    </div>
                    <div hlmCardContent>
                        <ul class="flex flex-wrap gap-x-2 gap-y-3">
                            @for (skill of group.skills; track skill.name) {
                            <li>
                                @if (skill.evidence; as evidence) {
                                <a hlmBadge variant="outline" [href]="evidence.href"
                                    class="text-meta relative h-8 gap-1.5 overflow-visible px-3 text-link underline-offset-4 after:absolute after:inset-x-0 after:-inset-y-1.5 after:content-[''] hover:underline"
                                    [attr.aria-label]="skill.name + ', used in ' + evidence.where">
                                    {{ skill.name }}<ng-icon name="lucideArrowUpRight" data-icon="inline-end" />
                                </a>
                                } @else {
                                <span hlmBadge variant="secondary" class="text-meta h-8 px-3">{{ skill.name }}</span>
                                }
                            </li>
                            }
                        </ul>
                    </div>
                </section>
            </div>
            }
        </div>
    </div>
</section>
