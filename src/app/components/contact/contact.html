<section id="contact" class="section-y px-6" aria-labelledby="contact-heading">
    <div class="mx-auto max-w-6xl">
        <p class="text-meta text-muted-foreground">Contact</p>
        <h2 id="contact-heading" class="text-heading mt-3">Get in Touch</h2>
        <p class="mt-3 max-w-xl text-muted-foreground">{{ status }}. Email is the fastest way to reach me.</p>

        <p #emailText class="mt-10 break-all font-mono text-2xl sm:text-3xl">{{ email.displayValue }}</p>

        <div class="mt-8 flex flex-wrap items-center gap-3">
            <button hlmBtn size="lg" type="button" (click)="copyEmail()">
                <ng-icon [name]="done() ? 'lucideCheck' : 'lucideCopy'" data-icon="inline-start" class="text-lg" />
                {{ label() }}
            </button>
            <a hlmBtn size="lg" variant="outline" [href]="email.url">Send Email</a>
            <a hlmBtn size="lg" variant="outline" [href]="cvUrl" download>Download CV</a>
            @for (link of profileLinks; track link.label) {
            <a hlmBtn size="lg" variant="outline" [href]="link.url" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4"
                    data-icon="inline-start" aria-hidden="true">
                    <path [attr.d]="link.svgPath" />
                </svg>
                {{ link.label }}<span class="sr-only"> (opens in a new tab)</span>
            </a>
            }
        </div>
        <p class="sr-only" aria-live="polite">{{ announcement() }}</p>
    </div>
</section>
