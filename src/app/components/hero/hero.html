<section id="hero" class="px-6 pb-16 pt-32 md:pb-24 md:pt-44" aria-labelledby="hero-heading">
    <div class="mx-auto grid max-w-6xl gap-14 lg:grid-cols-[1.6fr_1fr]">

        <div>
            <h1 id="hero-heading" class="text-display">{{ hero.name }}</h1>
            <p class="mt-6 text-xl font-semibold sm:text-2xl">{{ hero.title }}</p>
            <p class="mt-4 max-w-xl text-lg text-muted-foreground">{{ hero.bio }}</p>

            @if (hero.now; as now) {
            <p class="mt-5 max-w-xl text-[0.9375rem]">
                <span class="text-meta mr-2 text-muted-foreground">Now</span>{{ now }}
            </p>
            }

            <div class="mt-10 flex flex-wrap items-center gap-3">
                <a hlmBtn size="lg" class="bg-active text-active-foreground hover:bg-active/85" href="#work">View Projects</a>
                <a hlmBtn size="lg" variant="outline" href="#contact">Get in Touch</a>
                <a hlmBtn size="lg" variant="outline" [href]="cvUrl" download>Download CV</a>
            </div>

            <ul class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-1">
                @for (link of profileLinks; track link.label) {
                <li>
                    <a [href]="link.url" target="_blank" rel="noopener noreferrer"
                        class="inline-flex min-h-11 items-center gap-2 text-[0.9375rem] font-medium underline underline-offset-4 hover:text-muted-foreground">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                            class="size-4" aria-hidden="true">
                            <path [attr.d]="link.svgPath" />
                        </svg>
                        {{ link.label }}<span class="sr-only"> (opens in a new tab)</span>
                    </a>
                </li>
                }
            </ul>

            <p class="text-meta mt-6 flex items-center gap-3">
                <span class="size-2.5 shrink-0 bg-active outline outline-1 outline-foreground/60" aria-hidden="true"></span>
                {{ hero.status }}
            </p>
        </div>

        <!-- Centred against the text column so the whole card, and its flip button, stay in the first viewport -->
        <div class="lg:self-center">
            <app-id-card />
        </div>
    </div>
</section>
