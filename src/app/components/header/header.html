<a href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-primary focus:px-5 focus:py-3 focus:text-primary-foreground">
    Skip to Content
</a>

<header class="scroll-edge fixed inset-x-0 top-0 z-50" [attr.data-scrolled]="scrolled()">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-6">
        <a href="#hero" class="-mx-2 flex h-11 items-center px-2 text-lg font-semibold tracking-tight">WB.<span
                class="sr-only">, Willbert Budi Lian, back to top</span></a>

        <nav class="ml-auto hidden items-center gap-1 md:flex" aria-label="Main">
            @for (link of navLinks; track link.fragment) {
            <a [href]="'#' + link.fragment"
                class="flex h-11 items-center rounded-full px-4 text-[0.9375rem] font-medium text-muted-foreground transition-colors duration-200 hover:text-foreground aria-[current]:bg-muted aria-[current]:text-foreground"
                [attr.aria-current]="activeFragment() === link.fragment ? 'location' : null">
                {{ link.label }}
            </a>
            }
        </nav>

        <button hlmBtn variant="ghost" size="icon" type="button" class="hidden md:inline-flex" (click)="toggleTheme()"
            [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
            <ng-icon [name]="isDark() ? 'lucideSun' : 'lucideMoon'" class="text-xl" />
        </button>

        <!-- Below md: Contact and the theme toggle stay one tap away; sections live in the sheet -->
        <div class="ml-auto flex items-center gap-1 md:hidden">
            <a hlmBtn variant="outline" size="sm" href="#contact">Contact</a>
            <button hlmBtn variant="ghost" size="icon" type="button" (click)="toggleTheme()"
                [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
                <ng-icon [name]="isDark() ? 'lucideSun' : 'lucideMoon'" class="text-xl" />
            </button>

            <hlm-sheet #sheet="hlmSheet">
                <button hlmSheetTrigger side="right" hlmBtn variant="ghost" size="icon" type="button"
                    aria-label="Open menu">
                    <ng-icon name="lucideMenu" class="text-xl" />
                </button>
                <hlm-sheet-content *hlmSheetPortal class="w-[min(20rem,85vw)]">
                    <hlm-sheet-header class="h-[4.75rem] justify-center py-0">
                        <h2 hlmSheetTitle>Menu</h2>
                    </hlm-sheet-header>
                    <nav class="flex flex-col px-4" aria-label="Mobile">
                        @for (link of navLinks; track link.fragment) {
                        <a [href]="'#' + link.fragment"
                            class="flex h-12 items-center border-b text-lg font-medium last:border-b-0"
                            [attr.aria-current]="activeFragment() === link.fragment ? 'location' : null"
                            (click)="sheet.close({})">
                            {{ link.label }}
                        </a>
                        }
                    </nav>
                </hlm-sheet-content>
            </hlm-sheet>
        </div>
    </div>
</header>
