<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" [class]="headerClasses()">
    <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between" aria-label="Main navigation">
        <!-- Logo -->
        <a href="#hero"
            class="font-display text-xl font-bold tracking-tight transition-colors duration-200 hover:text-primary-500"
            aria-label="Go to top">
            WB<span class="text-primary-500">.</span>
        </a>

        <!-- Desktop Nav -->
        <ul class="hidden md:flex items-center gap-8 list-none m-0 p-0" role="list">
            @for (link of navLinks; track link.fragment) {
            <li>
                <a [href]="'#' + link.fragment"
                    class="text-sm font-medium transition-colors duration-200 hover:text-primary-500"
                    [class]="isDark() ? 'text-muted-dark' : 'text-muted-light'">
                    {{ link.label }}
                </a>
            </li>
            }
            <li>
                <button type="button" (click)="toggleTheme()"
                    class="w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-110 cursor-pointer border-0"
                    [class]="isDark()
                ? 'bg-card-dark text-text-dark hover:bg-border-dark'
                : 'bg-primary-50 text-primary-600 hover:bg-primary-100'"
                    [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
                    @if (isDark()) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                    }
                </button>
            </li>
        </ul>

        <!-- Mobile menu button -->
        <div class="flex items-center gap-3 md:hidden">
            <button type="button" (click)="toggleTheme()"
                class="w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 cursor-pointer border-0"
                [class]="isDark()
              ? 'bg-card-dark text-text-dark'
              : 'bg-primary-50 text-primary-600'"
                [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
                @if (isDark()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
                }
            </button>
            <button type="button" (click)="toggleMobileMenu()"
                class="w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 cursor-pointer border-0"
                [class]="isDark()
              ? 'bg-card-dark text-text-dark'
              : 'bg-primary-50 text-primary-600'" [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
                [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-nav">
                @if (mobileMenuOpen()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
                </svg>
                }
            </button>
        </div>
    </nav>

    <!-- Mobile Nav Panel -->
    @if (mobileMenuOpen()) {
    <div id="mobile-nav" class="md:hidden border-t px-6 py-4 transition-all duration-300" [class]="isDark()
            ? 'bg-surface-dark/95 border-border-dark backdrop-blur-xl'
            : 'bg-surface-light/95 border-border-light backdrop-blur-xl'" role="navigation"
        aria-label="Mobile navigation">
        <ul class="flex flex-col gap-4 list-none m-0 p-0" role="list">
            @for (link of navLinks; track link.fragment) {
            <li>
                <a [href]="'#' + link.fragment"
                    class="block text-base font-medium py-2 transition-colors duration-200 hover:text-primary-500"
                    [class]="isDark() ? 'text-text-dark' : 'text-text-light'" (click)="closeMobileMenu()">
                    {{ link.label }}
                </a>
            </li>
            }
        </ul>
    </div>
    }
</header>
